<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Star Glow Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Squircle Badge with Border -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Left Code Bracket < -->
  <path d="M 21 18 L 10 32 L 21 46" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Right Code Bracket > -->
  <path d="M 43 18 L 54 32 L 43 46" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Center AI Sparkle / Magic Star (Vibe Coding Icon) -->
  <path d="M 32 14 Q 32 32 41 32 Q 32 32 32 50 Q 32 32 23 32 Q 32 32 32 14 Z" fill="url(#starGrad)" filter="url(#glow)"/>

  <!-- Top-Right Accent Sparkle -->
  <circle cx="48" cy="16" r="2.5" fill="#38BDF8"/>
</svg>
